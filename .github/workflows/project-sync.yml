name: Project sync

# Moves the linked issue across the project board:
#   branch ST-<n>-… created → In Progress, PR opened → QA, PR converted to draft → In Progress.
# "Done" is handled by the board's built-in workflows when the PR merges.
on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    if: vars.PROJECT_NUMBER != '' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun scripts/gh/sync-project.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
