name: steganography-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stego
      POSTGRES_PASSWORD: stego
      POSTGRES_DB: stego
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stego"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate limits and short-lived shared state (ADR 0003). Password comes from .env.
  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
        "--appendonly",
        "yes",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (MinIO no longer publishes images).
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: stego
      RUSTFS_SECRET_KEY: stego-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket; 409 means it already exists.
  rustfs-init:
    image: rustfs/rustfs:1.0.4
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
      --aws-sigv4 aws:amz:us-east-1:s3 --user stego:stego-secret http://rustfs:9000/stego) &&
      echo \"create bucket stego: HTTP $$code\" &&
      [ $$code = 200 ] || [ $$code = 409 ]
      "

  # Reverse proxy in front of `bun run dev:web` on the host; sets X-Client-IP for per-IP rate limits.
  # Browse http://localhost:8080 to go through it (see .env.example, APP_ORIGIN and TRUSTED_PROXIES).
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  rustfs-data:
  redis-data:
