name: steganography-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stego
      POSTGRES_PASSWORD: stego
      POSTGRES_DB: stego
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stego"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (MinIO no longer publishes images).
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: stego
      RUSTFS_SECRET_KEY: stego-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the bucket; 409 means it already exists.
  rustfs-init:
    image: rustfs/rustfs:1.0.4
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
      --aws-sigv4 aws:amz:us-east-1:s3 --user stego:stego-secret http://rustfs:9000/stego) &&
      echo \"create bucket stego: HTTP $$code\" &&
      [ $$code = 200 ] || [ $$code = 409 ]
      "

volumes:
  postgres-data:
  rustfs-data:
